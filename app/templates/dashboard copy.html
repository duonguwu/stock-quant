<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Advanced Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #ecf0f1;
            border-radius: 8px;
        }

        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .refresh-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .tickers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .ticker-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }

        .ticker-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }

        .ticker-price {
            font-size: 1.2em;
            font-weight: bold;
            color: #27ae60;
        }

        .confidence-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .confidence-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .confidence-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }

        .confidence-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }

        .confidence-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 15px 0;
        }

        .signal-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.8em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .buy-color { background: #27ae60; }
        .sell-color { background: #e74c3c; }
        .hold-color { background: #95a5a6; }

        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 40px 0;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-indicator.connected { background: #27ae60; }
        .status-indicator.loading { background: #f39c12; }
        .status-indicator.error { background: #e74c3c; }

        /* Responsive */
        @media (max-width: 768px) {
            .confidence-charts {
                grid-template-columns: 1fr;
            }
            
            .tickers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚀 Advanced Trading Dashboard</h1>
            <p>Real-time signals với 5 confidence levels - 2 ngày data gần nhất</p>
            
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator" id="connection-status"></div>
                    <span id="connection-text">Connecting...</span>
                </div>
                
                <div class="status-item">
                    <span>📊 Market: {{ market_status.is_trading_hours and "Open" or "Closed" }}</span>
                </div>
                
                <div class="status-item">
                    <span>⏰ Updated: <span id="last-updated">{{ data_status.last_updated }}</span></span>
                </div>
                
                <button class="refresh-btn" onclick="refreshDashboard()" id="refresh-btn">
                    🔄 Refresh Charts
                </button>
            </div>
        </div>

        <!-- Current Prices Grid -->
        <div class="tickers-grid" id="tickers-grid">
            <div class="loading">Loading ticker data...</div>
        </div>

        <!-- Confidence Level Charts -->
        <div class="confidence-charts" id="confidence-charts">
            <div class="loading">Load data to see confidence level charts...</div>
        </div>
    </div>

    <script>
        let charts = {};
        let dashboardData = {};
        let wsConnection = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            updateConnectionStatus('loading', 'Loading...');
            initWebSocket();
            refreshDashboard();
        });

        // WebSocket connection
        function initWebSocket() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                wsConnection = new WebSocket(wsUrl);
                
                wsConnection.onopen = function() {
                    updateConnectionStatus('connected', 'Connected');
                };
                
                wsConnection.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.type === 'realtime_signals') {
                        handleRealtimeSignals(data.data);
                    }
                };
                
                wsConnection.onclose = function() {
                    updateConnectionStatus('error', 'Disconnected');
                    // Try to reconnect after 5 seconds
                    setTimeout(initWebSocket, 5000);
                };
                
            } catch (error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('error', 'Connection Error');
            }
        }

        // Update connection status
        function updateConnectionStatus(status, text) {
            const indicator = document.getElementById('connection-status');
            const textEl = document.getElementById('connection-text');
            
            indicator.className = `status-indicator ${status}`;
            textEl.textContent = text;
        }

        // Refresh dashboard data
        async function refreshDashboard() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.textContent = '🔄 Loading...';
            
            try {
                const response = await fetch('/api/dashboard-charts');
                const result = await response.json();
                
                if (result.status === 'success') {
                    dashboardData = result.data;
                    updateLastUpdated();
                    renderTickersGrid();
                    renderConfidenceCharts();
                    btn.textContent = '✅ Updated';
                } else {
                    console.error('Dashboard error:', result.message);
                    showError(result.message);
                    btn.textContent = '❌ Failed';
                }
                
            } catch (error) {
                console.error('Refresh error:', error);
                showError(`Connection error: ${error.message}`);
                btn.textContent = '❌ Error';
            }
            
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = '🔄 Refresh Charts';
            }, 3000);
        }

        // Render tickers grid
        function renderTickersGrid() {
            const container = document.getElementById('tickers-grid');
            const tickers = ['CTG', 'MBB', 'ACB', 'QNS', 'MSH'];
            
            container.innerHTML = '';
            
            tickers.forEach(ticker => {
                if (dashboardData[ticker]) {
                    const data = dashboardData[ticker];
                    const latestPrice = data.price_data[data.price_data.length - 1];
                    
                    const panel = document.createElement('div');
                    panel.className = 'ticker-panel';
                    panel.innerHTML = `
                        <div class="ticker-header">
                            <div class="ticker-name">${ticker}</div>
                            <div class="ticker-price">${latestPrice.close.toFixed(0)} VND</div>
                        </div>
                        <div style="font-size: 0.9em; color: #7f8c8d;">
                            <div>📊 Bars: ${data.data_range.total_bars}</div>
                            <div>📅 ${data.data_range.start} → ${data.data_range.end}</div>
                        </div>
                    `;
                    container.appendChild(panel);
                }
            });
        }

        // Render confidence level charts
        function renderConfidenceCharts() {
            const container = document.getElementById('confidence-charts');
            const confidenceLevels = ['conf_0.4', 'conf_0.5', 'conf_0.6', 'conf_0.7', 'conf_0.8'];
            const levelNames = {
                'conf_0.4': '40% Confidence',
                'conf_0.5': '50% Confidence', 
                'conf_0.6': '60% Confidence',
                'conf_0.7': '70% Confidence',
                'conf_0.8': '80% Confidence'
            };
            
            container.innerHTML = '';
            
            confidenceLevels.forEach(level => {
                const panel = document.createElement('div');
                panel.className = 'confidence-panel';
                
                // Count total signals across all tickers
                let totalSignals = 0;
                Object.values(dashboardData).forEach(tickerData => {
                    if (tickerData.signals && tickerData.signals[level]) {
                        totalSignals += tickerData.signals[level].total_signals;
                    }
                });
                
                panel.innerHTML = `
                    <div class="confidence-header">
                        <div class="confidence-title">${levelNames[level]}</div>
                        <div class="confidence-stats">
                            <span>Signals: ${totalSignals}</span>
                            <span>Tickers: ${Object.keys(dashboardData).length}</span>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="chart-${level}"></canvas>
                    </div>
                    <div class="signal-legend">
                        <div class="legend-item">
                            <div class="legend-color buy-color"></div>
                            <span>BUY</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color sell-color"></div>
                            <span>SELL</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color hold-color"></div>
                            <span>HOLD</span>
                        </div>
                    </div>
                `;
                
                container.appendChild(panel);
                
                // Create chart for this confidence level
                createConfidenceChart(level);
            });
        }

        // Create chart for specific confidence level
        function createConfidenceChart(level) {
            const ctx = document.getElementById(`chart-${level}`).getContext('2d');
            const tickers = ['CTG', 'MBB', 'ACB', 'QNS', 'MSH'];
            const colors = {
                'CTG': '#3498db',
                'MBB': '#e74c3c', 
                'ACB': '#2ecc71',
                'QNS': '#f39c12',
                'MSH': '#9b59b6'
            };
            
            const datasets = [];
            
            // Add price lines for each ticker
            tickers.forEach(ticker => {
                if (dashboardData[ticker]) {
                    const data = dashboardData[ticker];
                    
                    // Price line
                    datasets.push({
                        label: `${ticker} Price`,
                        data: data.price_data.map(item => ({
                            x: item.timestamp,
                            y: item.close
                        })),
                        borderColor: colors[ticker],
                        backgroundColor: 'transparent',
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        yAxisID: 'price'
                    });
                    
                    // Add signals for this confidence level
                    if (data.signals && data.signals[level]) {
                        const signals = data.signals[level].signals;
                        
                        // BUY signals
                        const buySignals = signals.filter(s => s.action === 'BUY');
                        if (buySignals.length > 0) {
                            datasets.push({
                                label: `${ticker} BUY`,
                                data: buySignals.map(s => ({
                                    x: s.timestamp,
                                    y: s.price
                                })),
                                backgroundColor: '#27ae60',
                                borderColor: '#27ae60',
                                pointStyle: 'triangle',
                                pointRadius: 8,
                                pointHoverRadius: 10,
                                showLine: false,
                                yAxisID: 'price'
                            });
                        }
                        
                        // SELL signals  
                        const sellSignals = signals.filter(s => s.action === 'SELL');
                        if (sellSignals.length > 0) {
                            datasets.push({
                                label: `${ticker} SELL`,
                                data: sellSignals.map(s => ({
                                    x: s.timestamp,
                                    y: s.price
                                })),
                                backgroundColor: '#e74c3c',
                                borderColor: '#e74c3c',
                                pointStyle: 'rectRounded',
                                pointRadius: 8,
                                pointHoverRadius: 10,
                                showLine: false,
                                yAxisID: 'price'
                            });
                        }
                    }
                }
            });
            
            // Destroy existing chart if it exists
            if (charts[level]) {
                charts[level].destroy();
            }
            
            charts[level] = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: false  // Hide legend to save space
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return context[0].parsed.x;
                                },
                                label: function(context) {
                                    const label = context.dataset.label;
                                    const value = context.parsed.y;
                                    return `${label}: ${value.toFixed(0)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'MM/dd'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        },
                        price: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Price (VND)'
                            }
                        }
                    }
                }
            });
        }

        // Handle realtime signals
        function handleRealtimeSignals(data) {
            console.log('Realtime signals received:', data);
            // Có thể refresh chart hoặc update signals realtime
            updateLastUpdated();
        }

        // Update last updated time
        function updateLastUpdated() {
            const now = new Date();
            document.getElementById('last-updated').textContent = 
                now.toLocaleTimeString();
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('confidence-charts');
            container.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        // Auto refresh every 5 minutes
        setInterval(() => {
            if (document.getElementById('refresh-btn').disabled === false) {
                refreshDashboard();
            }
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
